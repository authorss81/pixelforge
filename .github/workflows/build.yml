name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.44.8
  JAVA_VERSION: 17

jobs:
  verify:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: android
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Build split-per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Play Store bundle
        run: flutter build appbundle --release

      - name: Prove the release APK asks for no permissions
        # Uses aapt from the Android SDK that the Gradle build just populated.
        run: |
          set -euo pipefail
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk \
            | tee apk-permissions.txt
          if grep -q 'android.permission.INTERNET' apk-permissions.txt; then
            echo "::error::release APK requests INTERNET; the offline guarantee is broken"
            exit 1
          fi
          echo "No INTERNET permission in the release APK."

      - uses: actions/upload-artifact@v4
        with:
          name: pixelforge-android
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

  windows:
    name: windows
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip the bundle
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath pixelforge-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pixelforge-windows-x64
          path: pixelforge-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: release
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect release assets
        run: |
          mkdir -p assets
          find dist -name '*.apk'  -exec cp {} assets/ \;
          find dist -name '*.aab'  -exec cp {} assets/ \;
          find dist -name '*.zip' -exec cp {} assets/ \;
          ls -la assets

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          draft: true
          generate_release_notes: true
